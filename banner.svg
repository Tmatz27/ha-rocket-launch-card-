<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Rocket Launch Card for Home Assistant">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191c34"/>
      <stop offset="100%" stop-color="#101226"/>
    </linearGradient>
    <radialGradient id="glowA" cx="10%" cy="-10%" r="60%">
      <stop offset="0%" stop-color="#6c8cff" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="96%" cy="112%" r="60%">
      <stop offset="0%" stop-color="#7fe0ff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7fe0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="countdown" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fe0ff"/>
      <stop offset="100%" stop-color="#6c8cff"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7078" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#e14a56" stop-opacity=".86"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="30" fill="url(#card)"/>
  <rect width="1200" height="320" rx="30" fill="url(#glowA)"/>
  <rect width="1200" height="320" rx="30" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1198" height="318" rx="29" fill="none" stroke="#ffffff" stroke-opacity=".14"/>

  <!-- faint stars -->
  <g fill="#ffffff" fill-opacity=".55">
    <circle cx="120" cy="40" r="1.6"/>
    <circle cx="980" cy="28" r="1.4"/>
    <circle cx="1080" cy="70" r="1.8"/>
    <circle cx="860" cy="46" r="1.2"/>
    <circle cx="1140" cy="130" r="1.5"/>
    <circle cx="60" cy="120" r="1.3"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="64" y="90" fill="#f4f5fb" font-size="44" font-weight="800">🚀 Rocket Launch Card</text>
    <text x="64" y="124" fill="#a7abd6" font-size="19" font-weight="500">A live, site-filtered launch countdown for Home Assistant</text>

    <!-- hero mock -->
    <g transform="translate(64,152)">
      <rect width="520" height="140" rx="20" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
      <rect x="18" y="18" width="146" height="26" rx="13" fill="url(#hot)"/>
      <text x="91" y="35" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">FINAL COUNTDOWN</text>
      <text x="18" y="70" fill="#f4f5fb" font-size="21" font-weight="800">Starlink 12-3 · SpaceX</text>
      <text x="18" y="92" fill="#a7abd6" font-size="13">Vandenberg SFB (SLC-4E)</text>
      <text x="18" y="128" fill="url(#countdown)" font-size="34" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">00:41:07:52</text>
    </g>

    <!-- compact rows mock -->
    <g transform="translate(620,152)">
      <rect width="516" height="140" rx="20" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="20" y="30" fill="#a7abd6" font-size="12" font-weight="700" letter-spacing="1.5">UPCOMING</text>

      <g transform="translate(20,48)">
        <text x="0" y="14" fill="#f4f5fb" font-size="15" font-weight="700">NROL-212 · ULA</text>
        <text x="0" y="32" fill="#a7abd6" font-size="12">Vandenberg SFB (SLC-6)</text>
        <text x="476" y="14" fill="#a7abd6" font-size="13" font-weight="600" text-anchor="end">Fri 6:10 AM</text>
      </g>
      <line x1="0" y1="72" x2="476" y2="72" stroke="#ffffff" stroke-opacity=".10"/>
      <g transform="translate(20,88)">
        <text x="0" y="14" fill="#f4f5fb" font-size="15" font-weight="700">Transporter-16 · SpaceX</text>
        <text x="0" y="32" fill="#a7abd6" font-size="12">Vandenberg SFB (SLC-4E)</text>
        <text x="476" y="14" fill="#a7abd6" font-size="13" font-weight="600" text-anchor="end">NET Sep 14</text>
      </g>
    </g>
  </g>
</svg>
