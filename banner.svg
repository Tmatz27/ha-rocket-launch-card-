<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Rocket Launch Card for Home Assistant">
  <defs>
    <radialGradient id="rlWatermark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f8ef0" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#4f8ef0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="22" fill="#141416"/>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#ffffff" stroke-opacity=".09"/>

  <g fill="#ffffff" fill-opacity=".4">
    <circle cx="120" cy="40" r="1.4"/>
    <circle cx="980" cy="28" r="1.2"/>
    <circle cx="1080" cy="66" r="1.5"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="64" y="88" fill="#f2f2f3" font-size="42" font-weight="800">Rocket Launch Card</text>
    <text x="64" y="120" fill="#9a9a9e" font-size="18" font-weight="500">A live, site-filtered launch countdown for Home Assistant</text>

    <!-- hero mock: flat card, left accent bar, watermark circle -->
    <g transform="translate(64,148)">
      <rect width="520" height="140" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".09"/>
      <rect x="8" y="14" width="4" height="112" rx="2" fill="#e0574c"/>
      <circle cx="470" cy="130" r="70" fill="url(#rlWatermark)"/>
      <path d="M472 108 c10 0 18 8 18 18 c0 8 -8 18 -18 26 c-10 -8 -18 -18 -18 -26 c0 -10 8 -18 18 -18 z" fill="#4f8ef0" fill-opacity=".45"/>

      <rect x="22" y="18" width="150" height="24" rx="12" fill="#e0574c" fill-opacity=".2" stroke="#e0574c" stroke-opacity=".5"/>
      <text x="97" y="34" fill="#f2f2f3" font-size="12" font-weight="700" text-anchor="middle">FINAL COUNTDOWN</text>
      <text x="22" y="68" fill="#f2f2f3" font-size="20" font-weight="800">Starlink 12-3 · SpaceX</text>
      <text x="22" y="88" fill="#9a9a9e" font-size="13">Vandenberg SFB (SLC-4E)</text>
      <text x="22" y="124" fill="#4f8ef0" font-size="32" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">00:41:07:52</text>
    </g>

    <!-- compact rows mock -->
    <g transform="translate(620,148)">
      <rect width="516" height="140" rx="14" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="20" y="30" fill="#9a9a9e" font-size="11" font-weight="700" letter-spacing="1.5">UPCOMING</text>

      <g transform="translate(20,48)">
        <text x="0" y="14" fill="#f2f2f3" font-size="14" font-weight="700">NROL-212 · ULA</text>
        <text x="0" y="32" fill="#9a9a9e" font-size="12">Vandenberg SFB (SLC-6)</text>
        <text x="476" y="14" fill="#9a9a9e" font-size="12" font-weight="600" text-anchor="end">Fri 6:10 AM</text>
      </g>
      <line x1="0" y1="70" x2="476" y2="70" stroke="#ffffff" stroke-opacity=".08"/>
      <g transform="translate(20,86)">
        <text x="0" y="14" fill="#f2f2f3" font-size="14" font-weight="700">Transporter-16 · SpaceX</text>
        <text x="0" y="32" fill="#9a9a9e" font-size="12">Vandenberg SFB (SLC-4E)</text>
        <text x="476" y="14" fill="#9a9a9e" font-size="12" font-weight="600" text-anchor="end">NET Sep 14</text>
      </g>
    </g>
  </g>
</svg>
