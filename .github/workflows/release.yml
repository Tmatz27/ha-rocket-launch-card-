name: Release

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact release source
        run: |
          npm run check
          npm test
      - name: Publish versioned release and HACS asset
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "$tag" ]; then
            echo "Release tag $REF_NAME must match $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published; no existing release will be changed."
            exit 0
          fi
          node --input-type=module -e 'import fs from "node:fs"; const version=fs.readFileSync("VERSION","utf8").trim(); const section=fs.readFileSync("CHANGELOG.md","utf8").split(`## ${version}\n`)[1]?.split(/\n## /)[0]?.trim(); if(!section) throw Error("Missing release notes"); fs.writeFileSync("release-notes.md",section+"\n\nUpdate through HACS, then refresh your dashboard browser. No tracker update is required for this card release.\n");'
          gh release create "$tag" rocket-launch-card.js --target "$(git rev-parse HEAD)" --title "Rocket Launch Card $tag" --notes-file release-notes.md --latest
