name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (defaults to v + the VERSION file)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify card
        run: |
          npm run check
          npm test

      - name: Resolve release tag
        id: meta
        env:
          # Passed through the environment so a dispatch input cannot be
          # interpolated straight into the shell.
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="v$(tr -d '[:space:]' < VERSION)"
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$version"
          fi
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match the VERSION file ($version)." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: rocket-launch-card.js
