name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate for HACS
        uses: hacs/action@main
        with:
          category: plugin

  tests:
    name: Card tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Blueprint template regressions
        run: |
          python -m pip install -r tests/requirements-blueprints.txt
          python -m unittest discover -s tests -p 'test_blueprints.py' -v
