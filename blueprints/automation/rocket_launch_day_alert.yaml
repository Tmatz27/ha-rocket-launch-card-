blueprint:
  name: Rocket Launch - Launch Day Alert
  description: >
    Checks once a day whether your tracked site has a launch scheduled for
    today, and if so sends one notification naming it and its time. Reads
    the ha-rocket-launch-tracker integration's "Next Launch" sensor, which
    is already filtered server-side to your configured site - unlike the
    earlier version of this blueprint, there's no site-matching to do here
    at all.
  domain: automation
  source_url: https://github.com/Tmatz27/ha-rocket-launch-card-/blob/main/blueprints/automation/rocket_launch_day_alert.yaml
  input:
    next_launch_entity:
      name: Next launch sensor
      description: >
        The Rocket Launch Tracker integration's "Next Launch" sensor for
        your site, e.g. sensor.vandenberg_next_launch.
      selector:
        entity:
          filter:
            integration: rocket_launch_tracker
            device_class: timestamp
    check_time:
      name: Daily check time
      description: What time to run the once-a-day check.
      default: "08:00:00"
      selector:
        time: {}
    notify_service:
      name: Notify action
      description: >
        The notify action to call, e.g. notify.mobile_app_your_phone or
        notify.notify. Find exact names under Developer Tools > Actions by
        searching "notify".
      selector:
        text: {}

trigger:
  - trigger: time
    at: !input check_time

variables:
  next_launch_entity: !input next_launch_entity
  raw_state: "{{ states(next_launch_entity) }}"
  has_value: "{{ raw_state not in ['unknown', 'unavailable', 'none', ''] }}"
  next_dt: "{{ as_local(as_datetime(raw_state)) if has_value else None }}"
  is_today: "{{ has_value and next_dt.date() == now().date() }}"

condition:
  - condition: template
    value_template: "{{ is_today }}"

action:
  - action: !input notify_service
    data:
      title: "🚀 Launch today"
      message: >-
        {{ state_attr(next_launch_entity, 'name') }}
        ({{ state_attr(next_launch_entity, 'provider') }}) —
        {{ state_attr(next_launch_entity, 'pad_name') }} —
        {{ next_dt | as_timestamp | timestamp_custom('%-I:%M %p') }}

mode: single
