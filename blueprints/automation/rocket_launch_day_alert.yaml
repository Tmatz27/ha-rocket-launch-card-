blueprint:
  name: Rocket Launch - Launch Day Alert
  description: >
    Checks once a day whether your tracked site has a launch scheduled for
    today, and if so sends one notification naming it and its time. Reads
    the ha-rocket-launch-tracker integration's "Next Launch" sensor, which
    is already filtered server-side to your configured site - unlike the
    earlier version of this blueprint, there's no site-matching to do here
    at all. Skipped when today's date itself is only a rough placeholder
    (net_precision of Week or coarser) rather than a confirmed target day.
  domain: automation
  source_url: https://github.com/Tmatz27/ha-rocket-launch-card-/blob/main/blueprints/automation/rocket_launch_day_alert.yaml
  input:
    next_launch_entity:
      name: Next launch sensor
      description: >
        The Rocket Launch Tracker integration's "Next Launch" sensor for
        your site, e.g. sensor.vandenberg_next_launch.
      selector:
        entity:
          filter:
            integration: rocket_launch_tracker
            device_class: timestamp
    check_time:
      name: Daily check time
      description: What time to run the once-a-day check.
      default: "08:00:00"
      selector:
        time: {}
    notify_service:
      name: Notify action
      description: >
        The notify action to call, e.g. notify.mobile_app_your_phone or
        notify.notify. Find exact names under Developer Tools > Actions by
        searching "notify".
      selector:
        text: {}

trigger:
  - trigger: time
    at: !input check_time

variables:
  next_launch_entity: !input next_launch_entity
  raw_state: "{{ states(next_launch_entity) }}"
  launch_ts: "{{ as_timestamp(raw_state, 0) }}"
  eligible: >-
    {% set abbrev = (state_attr(next_launch_entity, 'status_abbrev') or '') | lower | replace(' ', '') | replace('-', '') %}
    {% set label = (state_attr(next_launch_entity, 'status') or '') | lower | replace(' ', '') | replace('-', '') %}
    {% set precision = (state_attr(next_launch_entity, 'net_precision') or '') | trim | lower %}
    {% set day_known = precision in ['', 'second', 'minute', 'hour', 'morning', 'afternoon', 'day'] %}
    {{ launch_ts > 0 and day_known and abbrev not in ['success', 'failure', 'partialfailure', 'inflight'] and label not in ['success', 'launchsuccessful', 'launchsuccess', 'failure', 'launchfailure', 'launchfailed', 'partialfailure', 'launchpartialfailure', 'inflight'] }}
  computed: >-
    {% set launch_dt = as_local(as_datetime(launch_ts)) if eligible else none %}
    {% set current = now() %}
    {{ dict(fire=(eligible and launch_ts > as_timestamp(current) and launch_dt.date() == current.date()), time_str=(launch_ts | timestamp_custom('%-I:%M %p') if launch_dt is not none else '')) }}

condition:
  - condition: template
    value_template: "{{ computed.fire }}"

action:
  # Run actions skips automation-level conditions; keep the eligibility guard.
  - condition: template
    value_template: "{{ computed.fire }}"
  - action: !input notify_service
    data:
      title: "🚀 Launch today"
      message: >-
        {{ state_attr(next_launch_entity, 'name') }}
        ({{ state_attr(next_launch_entity, 'provider') }}) —
        {{ state_attr(next_launch_entity, 'pad_name') }} — {{ computed.time_str }}

mode: single
