blueprint:
  name: Rocket Launch - Pet Safety Alert
  description: >
    A short-notice nudge to bring pets inside before a nearby launch's
    acoustic shock, separate from the other alerts: fires a set number of
    minutes before launch (default 15), but only if that moment falls
    before your bedtime cutoff (default 8:30 PM). Unlike the countdown
    alert, a launch that would fall after the cutoff is skipped entirely
    rather than shifted earlier - if you're already in bed, the pets are
    already in for the night and there's nothing to act on.
  domain: automation
  source_url: https://github.com/Tmatz27/ha-rocket-launch-card-/blob/main/blueprints/automation/rocket_launch_pet_safety_alert.yaml
  input:
    next_launch_entity:
      name: Next launch sensor
      description: >
        The Rocket Launch Tracker integration's "Next Launch" sensor for
        your site, e.g. sensor.vandenberg_next_launch.
      selector:
        entity:
          filter:
            integration: rocket_launch_tracker
            device_class: timestamp
    minutes_before:
      name: Minutes before launch
      default: 15
      selector:
        number:
          min: 2
          max: 60
          unit_of_measurement: minutes
    cutoff_time:
      name: Bedtime cutoff
      description: >
        If the alert moment (minutes-before, above) would fall at or after
        this clock time, skip it - a launch that late means pets are
        already in for the night.
      default: "20:30:00"
      selector:
        time: {}
    earliest_morning_time:
      name: Earliest morning time
      description: >
        The other edge of "asleep": an alert moment earlier than this is
        also skipped, since a launch at 2 AM means pets are still in for
        the night, not due for a pre-dawn walk.
      default: "06:00:00"
      selector:
        time: {}
    pet_names:
      name: Pet names (optional)
      description: >
        Used in the notification, e.g. "Grizzly and Luna". Leave blank for
        a generic "your pets" message.
      default: ""
      selector:
        text: {}
    dedup_helper:
      name: Dedup helper (input_text)
      description: >
        An Input Text helper used to remember the last launch alerted, so
        this does not repeat every minute. Create one under Settings >
        Devices & Services > Helpers if you don't already have one - use a
        different helper than the other two blueprints.
      selector:
        entity:
          filter:
            domain: input_text
    notify_service:
      name: Notify action
      description: >
        The notify action to call, e.g. notify.mobile_app_your_phone or
        notify.notify. Find exact names under Developer Tools > Actions by
        searching "notify".
      selector:
        text: {}

trigger:
  - trigger: time_pattern
    minutes: "/1"

variables:
  next_launch_entity: !input next_launch_entity
  minutes_before: !input minutes_before
  cutoff_time: !input cutoff_time
  earliest_morning_time: !input earliest_morning_time
  pet_names: !input pet_names
  dedup_helper: !input dedup_helper
  already_alerted: "{{ states(dedup_helper) }}"
  raw_state: "{{ states(next_launch_entity) }}"
  launch_ts: "{{ as_timestamp(raw_state, 0) }}"
  eligible: >-
    {% set abbrev = (state_attr(next_launch_entity, 'status_abbrev') or '') | lower | replace(' ', '') | replace('-', '') %}
    {% set label = (state_attr(next_launch_entity, 'status') or '') | lower | replace(' ', '') | replace('-', '') %}
    {{ launch_ts > 0 and abbrev not in ['success', 'failure', 'partialfailure', 'inflight'] and label not in ['success', 'launchsuccessful', 'launchsuccess', 'failure', 'launchfailure', 'launchfailed', 'partialfailure', 'launchpartialfailure', 'inflight'] }}
  computed: >-
    {% set current = now() %}
    {% set current_ts = as_timestamp(current) %}
    {% set alert_ts = launch_ts - (minutes_before | int) * 60 %}
    {% set alert_dt = as_local(as_datetime(alert_ts)) if eligible else none %}
    {% set alert_seconds = alert_dt.hour * 3600 + alert_dt.minute * 60 + alert_dt.second if alert_dt is not none else -1 %}
    {% set cutoff = today_at(cutoff_time) %}
    {% set morning = today_at(earliest_morning_time) %}
    {% set cutoff_seconds = cutoff.hour * 3600 + cutoff.minute * 60 + cutoff.second %}
    {% set morning_seconds = morning.hour * 3600 + morning.minute * 60 + morning.second %}
    {% set current_seconds = current.hour * 3600 + current.minute * 60 + current.second %}
    {% set awake = morning_seconds <= alert_seconds < cutoff_seconds and morning_seconds <= current_seconds < cutoff_seconds %}
    {% set key = next_launch_entity ~ '|' ~ raw_state %}
    {% set ready = already_alerted not in ['unknown', 'unavailable'] %}
    {% set fire = eligible and ready and awake and current_ts < launch_ts and current_ts >= alert_ts and key != already_alerted %}
    {{ dict(fire=fire, key=key, who=(pet_names if pet_names else 'your pets'), minutes_left=(((launch_ts-current_ts)/60) | round(0, 'ceil') | int if fire else 0)) }}

condition:
  - condition: template
    value_template: "{{ computed.fire }}"

action:
  - condition: template
    value_template: "{{ computed.fire }}"
  - action: !input notify_service
    data:
      title: "🐾 Bring {{ computed.who }} inside"
      message: >-
        {{ state_attr(next_launch_entity, 'name') }} launches from
        {{ state_attr(next_launch_entity, 'pad_name') }} in about
        {{ computed.minutes_left }} minutes - the launch will be loud nearby.
  - action: input_text.set_value
    target:
      entity_id: !input dedup_helper
    data:
      value: "{{ computed.key }}"

mode: single
