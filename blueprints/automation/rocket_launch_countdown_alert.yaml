blueprint:
  name: Rocket Launch - Countdown Alert
  description: >
    Sends one notification before your tracked site's next launch: normally
    1 hour ahead, but never later than a fallback clock time (default 8:30
    PM) - so a launch overnight still warns you before bed instead of
    waking you with a 1-hour-out alert at 1 AM. Checks every minute, so it
    can take up to a minute to fire after the threshold is crossed. Skipped
    while the target time is still a rough placeholder (net_precision
    coarser than an exact second) rather than counting down to a date
    Launch Library hasn't confirmed yet.

    Requires a one-time helper: create an Input Text helper (Settings >
    Devices & Services > Helpers > + Create Helper > Text) to remember which
    launch was last alerted, so the minute-by-minute check does not repeat
    the same notification. Any name works.
  domain: automation
  source_url: https://github.com/Tmatz27/ha-rocket-launch-card-/blob/main/blueprints/automation/rocket_launch_countdown_alert.yaml
  input:
    next_launch_entity:
      name: Next launch sensor
      description: >
        The Rocket Launch Tracker integration's "Next Launch" sensor for
        your site, e.g. sensor.vandenberg_next_launch.
      selector:
        entity:
          filter:
            integration: rocket_launch_tracker
            device_class: timestamp
    minutes_before:
      name: Minutes before launch
      description: Normal heads-up lead time, if it lands before the fallback time.
      default: 60
      selector:
        number:
          min: 5
          max: 240
          unit_of_measurement: minutes
    fallback_time:
      name: Latest alert time
      description: >
        Move late-night alerts to this clock time on the relevant evening,
        not today for a launch days away. Early-morning alerts move to the
        previous evening. The minute containing this cutoff is included.
      default: "20:30:00"
      selector:
        time: {}
    earliest_morning_time:
      name: Earliest morning alert time
      description: >
        Alerts earlier than this are moved to the previous evening's latest
        alert time. No catch-up notifications are sent while you are asleep.
        Must be earlier than Latest alert time.
      default: "06:00:00"
      selector:
        time: {}
    dedup_helper:
      name: Dedup helper (input_text)
      description: >
        An Input Text helper used to remember the last launch alerted, so this
        does not repeat every minute. Create one under Settings > Devices &
        Services > Helpers if you don't already have one.
      selector:
        entity:
          filter:
            domain: input_text
    notify_service:
      name: Notify action
      description: >
        The notify action to call, e.g. notify.mobile_app_your_phone or
        notify.notify. Find exact names under Developer Tools > Actions by
        searching "notify".
      selector:
        text: {}

trigger:
  - trigger: time_pattern
    minutes: "/1"

variables:
  next_launch_entity: !input next_launch_entity
  minutes_before: !input minutes_before
  fallback_time: !input fallback_time
  earliest_morning_time: !input earliest_morning_time
  dedup_helper: !input dedup_helper
  already_alerted: "{{ states(dedup_helper) }}"
  raw_state: "{{ states(next_launch_entity) }}"
  launch_ts: "{{ as_timestamp(raw_state, 0) }}"
  eligible: >-
    {% set abbrev = (state_attr(next_launch_entity, 'status_abbrev') or '') | lower | replace(' ', '') | replace('-', '') %}
    {% set label = (state_attr(next_launch_entity, 'status') or '') | lower | replace(' ', '') | replace('-', '') %}
    {% set precision = (state_attr(next_launch_entity, 'net_precision') or '') | trim | lower %}
    {{ launch_ts > 0 and precision in ['', 'second'] and abbrev not in ['success', 'failure', 'partialfailure', 'inflight'] and label not in ['success', 'launchsuccessful', 'launchsuccess', 'failure', 'launchfailure', 'launchfailed', 'partialfailure', 'launchpartialfailure', 'inflight'] }}
  computed: >-
    {% set current = now() %}
    {% set current_ts = as_timestamp(current) %}
    {% set candidate_ts = launch_ts - (minutes_before | int) * 60 %}
    {% set candidate = as_local(as_datetime(candidate_ts)) if eligible else none %}
    {% set cutoff = today_at(fallback_time) %}
    {% set morning = today_at(earliest_morning_time) %}
    {% set cutoff_seconds = cutoff.hour * 3600 + cutoff.minute * 60 + cutoff.second %}
    {% set morning_seconds = morning.hour * 3600 + morning.minute * 60 + morning.second %}
    {% set current_seconds = current.hour * 3600 + current.minute * 60 + current.second %}
    {% set candidate_seconds = candidate.hour * 3600 + candidate.minute * 60 + candidate.second if candidate is not none else 0 %}
    {% set fallback = candidate.replace(hour=cutoff.hour, minute=cutoff.minute, second=cutoff.second, microsecond=0) if candidate is not none else none %}
    {% set fallback = fallback - timedelta(days=1) if fallback is not none and candidate_seconds < morning_seconds else fallback %}
    {% set alert_ts = [candidate_ts, as_timestamp(fallback)] | min if fallback is not none else 0 %}
    {% set key = next_launch_entity ~ '|' ~ raw_state %}
    {# Include the cutoff minute for the once-per-minute trigger, but never catch up overnight. #}
    {% set awake = morning_seconds < cutoff_seconds and morning_seconds <= current_seconds < cutoff_seconds + 60 %}
    {% set ready = already_alerted not in ['unknown', 'unavailable'] %}
    {% set fire = eligible and ready and awake and current_ts < launch_ts and current_ts >= alert_ts and key != already_alerted %}
    {{ dict(fire=fire, key=key, minutes_left=(((launch_ts-current_ts)/60) | round(0, 'ceil') | int if fire else 0)) }}

condition:
  - condition: template
    value_template: "{{ computed.fire }}"

action:
  - condition: template
    value_template: "{{ computed.fire }}"
  - action: !input notify_service
    data:
      title: "🚀 Launch countdown"
      message: >-
        {{ state_attr(next_launch_entity, 'name') }}
        ({{ state_attr(next_launch_entity, 'provider') }}) — about
        {{ computed.minutes_left }} min to go.
  - action: input_text.set_value
    target:
      entity_id: !input dedup_helper
    data:
      value: "{{ computed.key }}"

mode: single
