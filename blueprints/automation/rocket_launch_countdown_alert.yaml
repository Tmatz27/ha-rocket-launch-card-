blueprint:
  name: Rocket Launch - Countdown Alert
  description: >
    Sends one notification before your tracked site's next launch: normally
    1 hour ahead, but never later than a fallback clock time (default 8:30
    PM) - so a launch overnight still warns you before bed instead of
    waking you with a 1-hour-out alert at 1 AM. Checks every minute, so it
    can take up to a minute to fire after the threshold is crossed.

    Requires a one-time helper: create an Input Text helper (Settings >
    Devices & Services > Helpers > + Create Helper > Text) to remember which
    launch was last alerted, so the minute-by-minute check does not repeat
    the same notification. Any name works.
  domain: automation
  source_url: https://github.com/Tmatz27/ha-rocket-launch-card-/blob/main/blueprints/automation/rocket_launch_countdown_alert.yaml
  input:
    next_launch_entity:
      name: Next launch sensor
      description: >
        The Rocket Launch Tracker integration's "Next Launch" sensor for
        your site, e.g. sensor.vandenberg_next_launch.
      selector:
        entity:
          filter:
            integration: rocket_launch_tracker
            device_class: timestamp
    minutes_before:
      name: Minutes before launch
      description: Normal heads-up lead time, if it lands before the fallback time.
      default: 60
      selector:
        number:
          min: 5
          max: 240
          unit_of_measurement: minutes
    fallback_time:
      name: Latest alert time
      description: >
        Never alert later than this clock time, even if that is less than the
        usual lead time before launch (this is what covers an overnight
        launch).
      default: "20:30:00"
      selector:
        time: {}
    dedup_helper:
      name: Dedup helper (input_text)
      description: >
        An Input Text helper used to remember the last launch alerted, so this
        does not repeat every minute. Create one under Settings > Devices &
        Services > Helpers if you don't already have one.
      selector:
        entity:
          filter:
            domain: input_text
    notify_service:
      name: Notify action
      description: >
        The notify action to call, e.g. notify.mobile_app_your_phone or
        notify.notify. Find exact names under Developer Tools > Actions by
        searching "notify".
      selector:
        text: {}

trigger:
  - trigger: time_pattern
    minutes: "/1"

variables:
  next_launch_entity: !input next_launch_entity
  minutes_before: !input minutes_before
  fallback_time: !input fallback_time
  dedup_helper: !input dedup_helper
  already_alerted: "{{ states(dedup_helper) }}"
  raw_state: "{{ states(next_launch_entity) }}"
  has_value: "{{ raw_state not in ['unknown', 'unavailable', 'none', ''] }}"
  launch_dt: "{{ as_local(as_datetime(raw_state)) if has_value else None }}"
  # Every branch collapses into flat `set` statements ending in one bare
  # {{ dict(...) }} expression - no nested {% if %} wrapping that final
  # expression - so the rendered template is a single native value with no
  # stray indentation/whitespace around it. A dict template with leading
  # whitespace (e.g. from an indented {{ }} inside an {% if %} block) can
  # fail to come back as a real dict, which would break `computed.fire`
  # below, so this shape is deliberate, not just a style choice.
  computed: |-
    {% set still_ahead = has_value and launch_dt > now() %}
    {% set candidate_dt = (launch_dt - timedelta(minutes=minutes_before | int)) if still_ahead else None %}
    {% set fallback_dt = today_at(fallback_time) %}
    {% set alert_dt = ([candidate_dt, fallback_dt] | min) if candidate_dt is not none else None %}
    {% set key = (next_launch_entity ~ '|' ~ raw_state) if still_ahead else '' %}
    {% set should_fire = still_ahead and alert_dt is not none and now() >= alert_dt and key != already_alerted %}
    {% set minutes_left = (((launch_dt - now()).total_seconds() / 60) | round(0, 'floor') | int) if should_fire else 0 %}
    {{ dict(fire=should_fire, key=(key if should_fire else ''), minutes_left=minutes_left) }}

condition:
  - condition: template
    value_template: "{{ computed.fire }}"

action:
  - action: !input notify_service
    data:
      title: "🚀 Launch countdown"
      message: >-
        {{ state_attr(next_launch_entity, 'name') }}
        ({{ state_attr(next_launch_entity, 'provider') }}) — about
        {{ computed.minutes_left }} min to go.
  - action: input_text.set_value
    target:
      entity_id: !input dedup_helper
    data:
      value: "{{ computed.key }}"

mode: single
